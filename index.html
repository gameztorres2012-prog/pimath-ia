<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pimath IA</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#B8791E">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1ECDD; --ink:#1C2620; --ink-dim:#5E6B62;
  --gold:#B8791E; --gold-soft:#F3E4C4; --line:#E4DCC8; --user-bubble:#E8DFC4; --bot-bubble:#F4F1E8;
  --error:#B8422F;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1ECDD; --ink:#1C2620; --ink-dim:#5E6B62;
  --gold:#B8791E; --gold-soft:#F3E4C4; --line:#E4DCC8; --user-bubble:#E8DFC4; --bot-bubble:#F4F1E8;
  --error:#B8422F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1ECDD; --ink:#1C2620; --ink-dim:#5E6B62;
    --gold:#B8791E; --gold-soft:#F3E4C4; --line:#E4DCC8; --user-bubble:#E8DFC4; --bot-bubble:#F4F1E8;
    --error:#B8422F;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); display:flex; flex-direction:column;
}
* { box-sizing:border-box; }

#nameScreen{
  flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
}
.name-card{ max-width:340px; width:100%; text-align:center; }
.name-badge{
  width:64px; height:64px; border-radius:50%; background:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; font-size:1.8rem;
  margin:0 auto 16px;
}
.name-card h2{ font-family:var(--font-display); font-weight:700; font-size:1.4rem; margin:0 0 6px; }
.name-card p{ color:var(--ink-dim); font-size:.9rem; margin:0 0 18px; }
.name-card input{
  width:100%; padding:12px 16px; border:1px solid var(--line); border-radius:10px;
  font-family:var(--font-body); font-size:1rem; background:var(--panel); color:var(--ink);
  margin-bottom:14px; outline:none;
}
.name-card input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.name-card button{
  width:100%; padding:12px; border:none; border-radius:10px; background:var(--gold);
  color:#fff; font-size:1rem; font-weight:600; cursor:pointer; font-family:var(--font-body);
}

#appShell{ flex:1; display:flex; flex-direction:column; min-height:0; }
header{
  padding:18px 20px calc(14px); border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:10px; flex-shrink:0;
}
header h1{ font-family:var(--font-display); font-weight:700; font-size:1.4rem; margin:0; }
header span{ font-size:.8rem; color:var(--ink-dim); flex:1; }

.icon-btn{ background:none; border:none; font-size:1.05rem; cursor:pointer; padding:4px; color:var(--ink); flex-shrink:0; }

#sidebar{
  position:fixed; top:0; left:-82%; width:82%; max-width:300px; height:100%;
  background:var(--panel); border-right:1px solid var(--line); z-index:30;
  display:flex; flex-direction:column; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  transition:left .25s ease; box-shadow:2px 0 16px rgba(0,0,0,.08);
}
#sidebar.open{ left:0; }
#sidebarHeader{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
#sidebarHeader h3{ font-family:var(--font-display); margin:0; font-size:1.1rem; }
#sidebarClose{ background:none; border:none; font-size:1rem; cursor:pointer; color:var(--ink-dim); }
#sidebarNewChat{
  width:100%; padding:10px; border:1px solid var(--gold); border-radius:10px; background:var(--gold-soft);
  color:var(--gold); font-weight:600; font-size:.9rem; cursor:pointer; margin-bottom:14px; font-family:var(--font-body);
}
#historyList{ flex:1; overflow-y:auto; }
.history-item{
  padding:10px 8px; border-radius:8px; font-size:.85rem; color:var(--ink); cursor:pointer;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:6px;
}
.history-item.active{ background:var(--panel-2); font-weight:600; }
.history-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-delete{
  flex-shrink:0; background:none; border:none; font-size:.8rem; cursor:pointer;
  opacity:.55; padding:2px 6px; border-radius:6px; white-space:nowrap;
}
.history-delete[data-confirm="1"]{ opacity:1; background:var(--error); color:#fff; font-weight:600; }
.history-delete:hover{ opacity:1; background:var(--gold-soft); }
#sidebarOverlay{
  position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:25;
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
#sidebar.open ~ #sidebarOverlay, #sidebar.open + #sidebarOverlay{ opacity:1; pointer-events:auto; }

#areas{
  display:flex; gap:8px; padding:10px 16px; overflow-x:auto; flex-shrink:0;
  border-bottom:1px solid var(--line);
}
.area-chip{
  font-family:var(--font-body); font-size:.82rem; padding:6px 13px; border-radius:20px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink-dim);
  white-space:nowrap; cursor:pointer; transition:background .15s, color .15s;
}
.area-chip.active{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }

#chat{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:86%; padding:12px 16px; border-radius:18px; line-height:1.6; font-size:.96rem; word-wrap:break-word; animation:msg-in .25s ease; }
@keyframes msg-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.msg.user{ align-self:flex-end; background:#FFFFFF; color:var(--ink); border:1px solid var(--line); border-bottom-right-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.msg.bot{ align-self:flex-start; max-width:94%; background:#FBF8F0; border:1px solid var(--line); border-bottom-left-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.msg.bot.thinking{ background:transparent; border:none; box-shadow:none; padding:4px 0; align-self:flex-start; display:flex; align-items:center; gap:10px; }
.thinking-logo{ width:44px; height:44px; display:block; border-radius:50%; object-fit:cover; background:var(--bot-bubble); border:1px solid var(--line); animation:pimath-pulse 1.1s ease-in-out infinite; flex-shrink:0; }
.thinking-text{ color:var(--ink-dim); font-size:.9rem; font-style:italic; }
@keyframes pimath-pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.75; } }
.msg img.attach{ max-width:100%; border-radius:8px; display:block; margin-bottom:6px; }
.msg :is(h1,h2,h3){ font-family:var(--font-display); font-size:1.05rem; margin:.4em 0 .2em; }
.msg strong{ color:var(--gold); }
.msg code{ background:var(--panel-2); padding:1px 5px; border-radius:4px; font-size:.88em; }
.msg ol, .msg ul{ padding-left:1.3em; margin:.4em 0; }
.msg li{ margin:.35em 0; }
header{ position:relative; }
#userSlot{ align-self:center; flex-shrink:0; display:flex; align-items:center; }
.avatar-btn{ width:38px; height:38px; border-radius:50%; border:2px solid var(--gold-soft); padding:0; background:var(--gold); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.avatar-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
#userMenu{ display:none; position:absolute; right:14px; top:calc(100% - 4px); z-index:40; min-width:230px; max-width:80vw; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.15); padding:14px; }
#userMenu.open{ display:block; }
#userMenu .um-name{ font-weight:600; font-size:.95rem; margin:0; word-break:break-word; }
#userMenu .um-mail{ font-size:.8rem; color:var(--ink-dim); margin:2px 0 12px; word-break:break-all; }
#userMenu button{ width:100%; padding:9px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); color:var(--ink); font-size:.88rem; cursor:pointer; font-family:var(--font-body); }
.name-or{ color:var(--ink-dim); font-size:.8rem; margin:16px 0 12px; }
#gsiBtn{ display:flex; justify-content:center; min-height:44px; }
#loginScreen{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
.skip-link{ margin-top:18px; background:none; border:none; color:var(--ink-dim); font-size:.85rem; text-decoration:underline; cursor:pointer; font-family:var(--font-body); }
#premiumToast{ position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(16px); background:#1C2620; color:#fff; padding:12px 18px; border-radius:24px; font-size:.9rem; line-height:1.4; text-align:center; max-width:88vw; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.25); }
#premiumToast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.speak-btn{ display:block; margin-top:10px; background:none; border:1px solid var(--line); border-radius:14px; padding:4px 12px; font-size:.8rem; color:var(--ink-dim); cursor:pointer; font-family:var(--font-body); }
.speak-btn:active{ background:var(--gold-soft); }
.msg p{ margin:.45em 0; }
.msg > :first-child{ margin-top:0; }
.msg > :last-child{ margin-bottom:0; }
.msg .katex{ font-size:1.08em; }
.msg .katex-display{ margin:.7em 0; padding:.5em .4em; background:var(--gold-soft); border-radius:10px; overflow-x:auto; overflow-y:hidden; }
.error-note{ align-self:center; color:var(--error); font-size:.82rem; text-align:center; }

#composer{
  flex-shrink:0; border-top:1px solid var(--line); background:var(--panel);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
}
#preview{ display:none; padding:0 4px 8px; }
#preview img{ height:64px; border-radius:8px; border:1px solid var(--line); }
#preview button{ margin-left:8px; font-size:.75rem; background:none; border:none; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
#row{ display:flex; align-items:flex-end; gap:8px; }
#imgBtn{
  flex-shrink:0; width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--ink); font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#imgBtn.disabled{ opacity:.35; cursor:not-allowed; pointer-events:none; }
#micBtn{
  flex-shrink:0; width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--ink); font-size:1.1rem; cursor:pointer;
}
#micBtn.recording{ background:var(--error); color:#fff; animation:pimath-mic-pulse 1s infinite; }
@keyframes pimath-mic-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
.premium-chip{
  background:linear-gradient(135deg,#1d4ed8,#d97706) !important; color:#fff !important;
  font-weight:700 !important; border:none !important; box-shadow:0 2px 8px rgba(217,119,6,.4);
}
.pimath-avatar-container{ text-align:center; margin-bottom:10px; }
.pimath-avatar-img{ width:130px; height:auto; border-radius:16px; box-shadow:0 4px 12px rgba(0,0,0,.15); transition:transform .15s ease; transform-origin:center bottom; }
.pimath-avatar-img.talking{ animation:pimath-talk .38s ease-in-out infinite; }
@keyframes pimath-talk{
  0%{ transform:translateY(0) rotate(0deg) scale(1); }
  25%{ transform:translateY(-4px) rotate(-1.5deg) scale(1.015); }
  50%{ transform:translateY(0) rotate(0deg) scale(1); }
  75%{ transform:translateY(-3px) rotate(1.5deg) scale(1.01); }
  100%{ transform:translateY(0) rotate(0deg) scale(1); }
}
textarea#input{
  flex:1; resize:none; max-height:120px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); padding:10px 14px; font-family:var(--font-body);
  font-size:.95rem; line-height:1.4;
}
textarea#input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
#sendBtn{
  flex-shrink:0; width:42px; height:42px; border-radius:10px; border:none;
  background:var(--gold); color:var(--bg); font-size:1.05rem; cursor:pointer; font-weight:600;
}
#sendBtn:disabled{ opacity:.4; cursor:not-allowed; }
#stopBtn{
  flex-shrink:0; padding:0 12px; height:40px; border-radius:18px; border:1px solid var(--error);
  background:transparent; color:var(--error); font-size:.82rem; cursor:pointer; display:none;
}
#unavailable{ display:none; padding:14px; text-align:center; color:var(--ink-dim); font-size:.85rem; }
::selection{ background:var(--gold-soft); }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script><link rel="stylesheet" href="/gemini-barra.css">
<style id="brandStyle">
/* Título y subtítulo como eran al principio (letra Fraunces, con serifa) */
header h1{ font-family:var(--font-display) !important; font-weight:700 !important; font-size:1.4rem !important; letter-spacing:normal !important; word-spacing:normal !important; color:var(--ink) !important; margin:0 !important; }
header > span{ font-family:var(--font-body) !important; font-size:.8rem !important; font-weight:400 !important; letter-spacing:normal !important; color:var(--ink-dim) !important; flex:1 !important; }
.name-card h2{ font-family:var(--font-display) !important; font-weight:700 !important; }
/* Se ocultan los botones de áreas (General, Aritmética, Álgebra, Geometría, Estadística) */
#areas{ display:none !important; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="name-card">
    <div class="name-badge">🧮</div>
    <h2>Pimath IA</h2>
    <p>Tu profesor de matemáticas con IA. Inicia sesión para continuar.</p>
    <div id="gsiBtn"></div>
  </div>
</div>

<div id="nameScreen" style="display:none">
  <div class="name-card">
    <div class="name-badge">🧮</div>
    <h2>¡Bienvenido a Pimath IA!</h2>
    <p>¿Cómo quieres que te llame?</p>
    <input type="text" id="nameInput" placeholder="Escribe tu nombre..." maxlength="30">
    <button id="nameSubmit">Entrar a Pimath IA</button>
  </div>
</div>

<div id="sidebar">
  <div id="sidebarHeader">
    <h3>Historial</h3>
    <button id="sidebarClose" title="Cerrar">✕</button>
  </div>
  <button id="sidebarNewChat">+ Nuevo chat</button>
  <div id="historyList"></div>
</div>
<div id="sidebarOverlay"></div>

<div id="appShell" style="display:none">
<header>
  <button id="menuBtn" class="icon-btn" title="Historial">☰</button>
  <h1>Pimath IA</h1>
  <span>Tu profesor IA</span>
  <button id="premiumChip" class="premium-chip header-premium" type="button">Actualizar a Premium<small>para obtener la app de Pimath sin internet</small></button>
  <div id="userSlot"></div>
  <div id="userMenu"></div>
</header>

<div id="areas">
  <button class="area-chip active" data-area="">General</button>
  <button class="area-chip" data-area="Aritmética">Aritmética</button>
  <button class="area-chip" data-area="Álgebra">Álgebra</button>
  <button class="area-chip" data-area="Geometría">Geometría</button>
  <button class="area-chip" data-area="Estadística">Estadística</button>
</div>

<div id="chat"></div>
<div id="unavailable">Pimath IA no está disponible en esta vista.</div>

<div id="composer">
  <div id="preview"><img id="previewImg" alt=""><button id="removeImg">quitar</button></div>
  <div id="row">
    <label id="imgBtn" for="fileInput" title="Subir foto del problema">📷</label>
    <button id="micBtn" type="button" title="Hablar con Pimath">🎙️</button>
    <textarea id="input" rows="1" placeholder="Escribe o habla con Pimath IA..."></textarea>
    <button id="stopBtn">Detener</button>
    <button id="sendBtn">➤</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
</div>
</div>

const inputEl = document.getElementById('input');

const stopBtn = document.getElementById('stopBtn');
const imgBtn = document.getElementById('imgBtn');

let turns = [];
let history = [];
let chats = [];
let activeChatId = null;
const STORAGE_KEY = 'pimath_state_v2';
function getActiveChat(){ return chats.find(c => c.id === activeChatId); }
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: studentName, chats, activeId: activeChatId }));
  }catch(e){ /* almacenamiento no disponible; seguir sin guardar */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
let pendingFile = null;
let currentArea = '';
let ctl = null;

function addMsg(role, html, opts={}){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (opts.thinking ? ' thinking' : '');
  div.innerHTML = html;
  if(role !== 'user' && !opts.thinking) renderMath(div);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSpeakBtn(div, text){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'speak-btn';
  b.textContent = '🔊 Escuchar';
  b.addEventListener('click', () => {
    if('speechSynthesis' in window && window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      document.querySelectorAll('.pimath-avatar-img').forEach(img => img.classList.remove('talking'));
      return;
    }
    hablarTexto(text);
  });
  div.appendChild(b);
}

function renderMath(el){
  if(!window.renderMathInElement) return;
  try{
    window.renderMathInElement(el, {
      delimiters: [
        {left:'$$', right:'$$', display:true},
        {left:'\\[', right:'\\]', display:true},
        {left:'\\(', right:'\\)', display:false}
      ],
      throwOnError: false
    });
  }catch(e){}
}
window.addEventListener('load', () => {
  document.querySelectorAll('.msg.bot').forEach(renderMath);
});

function mdToHtml(text){
  // 1) Guardar las fórmulas para que el formato no las dañe
  const maths = [];
  text = text.replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(?!\s)[^\n$]+?(?<!\s)\$(?!\d)/g, m => {
    let f = m.replace(/\n/g,' ');
    if(/^\$[^$]/.test(f)) f = '\\(' + f.slice(1,-1) + '\\)';
    maths.push(f);
    return '@@M' + (maths.length-1) + '@@';
  });
  // 2) Formato normal
  let t = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>');
  t = t.split(/\n\n+/).map(p => {
    if (/^<h[23]>/.test(p)) return p;
    if (/^\d+\.\s/.test(p)) {
      const items = p.split('\n').filter(l=>l.trim()).map(l=>'<li>'+l.replace(/^\d+\.\s*/,'')+'</li>').join('');
      return '<ol>'+items+'</ol>';
    }
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  // 3) Devolver las fórmulas
  t = t.replace(/@@M(\d+)@@/g, (_, i) =>
    maths[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  return t;
}

function errorCopy(msg){
  if(!msg) return 'Ocurrió un error. Intenta de nuevo.';
  const m = msg.toLowerCase();
  if(m.includes('timeout') || m.includes('http_504') || m.includes('http_502')) return 'Pimath tardó demasiado en responder. Intenta de nuevo, o con una pregunta más corta.';
  if(m.includes('demand') || m.includes('overloaded') || m.includes('unavailable') || m.includes('503')) return 'Pimath tiene mucha demanda en este momento. Intenta de nuevo en unos segundos.';
  if(m.includes('quota') || m.includes('rate limit') || m.includes('resource_exhausted') || m.includes('429')) return 'Se alcanzó el límite de mensajes gratis por hoy. Intenta más tarde.';
  if(m.includes('safety') || m.includes('block')) return 'No puedo ayudar con esa solicitud. Intenta reformular tu pregunta.';
  return 'Hubo un problema de conexión. Intenta de nuevo.';
}

function createChat(){
  const id = Date.now() + '-' + Math.random().toString(36).slice(2,6);
  const chat = {
    id, title: '',
    turns: [], // historial plano {role:'user'|'model', text} para enviar al backend
    history: [], area: ''
  };
  chats.unshift(chat);
  activeChatId = id;
  turns = chat.turns; history = chat.history; currentArea = '';
  renderActiveChat();
  renderSidebar();
  saveState();
}

function loadChat(id){
  const chat = chats.find(c => c.id === id);
  if(!chat) return;
  activeChatId = id;
  turns = chat.turns; history = chat.history; currentArea = chat.area || '';
  renderActiveChat();
  closeSidebar();
  renderSidebar();
  saveState();
}

function renderSidebar(){
  historyList.innerHTML = '';
  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'history-item' + (chat.id === activeChatId ? ' active' : '');
    const titleSpan = document.createElement('span');
    titleSpan.className = 'history-title';
    titleSpan.textContent = chat.title ? (chat.title.length > 30 ? chat.title.slice(0,30) + '…' : chat.title) : 'Nueva conversación';
    item.appendChild(titleSpan);

    delBtn.className = 'history-delete';

    delBtn.textContent = '🗑';
    delBtn.dataset.confirm = '0';
    delBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(delBtn.dataset.confirm === '1'){

      }else{
        document.querySelectorAll('.history-delete[data-confirm="1"]').forEach(b=>{ b.dataset.confirm='0'; b.textContent='🗑'; });

        clearTimeout(delBtn._t);

    item.appendChild(delBtn);

// --- Voz: escuchar y hablar ---
let reconocimientoVoz = null;
let grabacionActiva = false;
const micBtn = document.getElementById('micBtn');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognitionAPI){
  reconocimientoVoz = new SpeechRecognitionAPI();
  reconocimientoVoz.lang = 'es-ES';
  reconocimientoVoz.continuous = false;
  reconocimientoVoz.onresult = (event)=>{
    inputEl.value = event.results[0][0].transcript;
    toggleMicrofono();
    send();
  };
  reconocimientoVoz.onerror = ()=> toggleMicrofono();
  reconocimientoVoz.onend = ()=>{ if(grabacionActiva) toggleMicrofono(); };
}else{
  micBtn.style.display = 'none';
}
function toggleMicrofono(){
  if(!reconocimientoVoz) return;
  if(!grabacionActiva){
    grabacionActiva = true;
    micBtn.classList.add('recording');
    try{ reconocimientoVoz.start(); }catch(e){ grabacionActiva = false; micBtn.classList.remove('recording'); }
  }else{
    grabacionActiva = false;
    micBtn.classList.remove('recording');
    reconocimientoVoz.stop();
  }
}
micBtn.addEventListener('click', toggleMicrofono);

let speechUnlocked = false;
let spanishVoice = null;
function pickSpanishVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  if(!voices.length){ spanishVoice = null; return; }
  const score = (v) => {
    const n = v.name.toLowerCase();
    let s = 0;
    if(n.includes('google')) s += 3;           // voces de Google en Chrome suelen ser más naturales
    if(n.includes('natural') || n.includes('neural')) s += 4;
    if(n.includes('female') || n.includes('mujer')) s += 2;
    if(/paulina|mónica|monica|helena|lucia|lucía|elvira|marisol|esperanza/.test(n)) s += 2;
    if(v.lang.toLowerCase() === 'es-es' || v.lang.toLowerCase() === 'es-us') s += 1;
    if(n.includes('compact')) s -= 3;           // voces "compact" del sistema suelen sonar robóticas
    return s;
  };
  spanishVoice = voices.sort((a,b)=> score(b) - score(a))[0];
}
if('speechSynthesis' in window){
  pickSpanishVoice();
  window.speechSynthesis.onvoiceschanged = pickSpanishVoice;
}
function unlockSpeech(){
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){ /* no se pudo desbloquear el audio */ }
}
document.addEventListener('click', unlockSpeech, { once:true, capture:true });

function hablarTexto(texto){
  if(!('speechSynthesis' in window)) return;
  unlockSpeech();
  window.speechSynthesis.cancel();
  const textoLimpio = texto
    .replace(/<[^>]+>/g,' ')
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,' $1 sobre $2 ')
    .replace(/\\sqrt\{([^{}]*)\}/g,' raíz de $1 ')
    .replace(/\\cdot|\\times/g,' por ')
    .replace(/\\[a-zA-Z]+/g,' ')
    .replace(/\$/g,' ')
    .replace(/[{}^]/g,' ')
    .replace(/[*#_~]/g,'');
  const utterance = new SpeechSynthesisUtterance(textoLimpio);
  utterance.lang = 'es-ES';
  if(spanishVoice) utterance.voice = spanishVoice;
  utterance.rate = 0.95;
  utterance.pitch = 1.05;
  const setTalking = (on) => {
    document.querySelectorAll('.pimath-avatar-img').forEach(img => img.classList.toggle('talking', on));
  };
  utterance.onstart = () => setTalking(true);
  utterance.onend = () => setTalking(false);
  utterance.onerror = () => setTalking(false);
  window.speechSynthesis.speak(utterance);
}

function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function send(){
  const text = inputEl.value.trim();
  if(!text && !pendingFile) return;
  primeSpeech();

  let userHtml = '';
  if(pendingFile) userHtml += `<img class="attach" src="${previewImg.src}" alt="foto del problema">`;
  if(text) userHtml += text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  addMsg('user', userHtml || '(imagen enviada)');
  history.push({role:'user', html: text ? text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '(imagen enviada)'});
  const activeChat = getActiveChat();
  if(activeChat && !activeChat.title){
    activeChat.title = text ? text.slice(0,40) : 'Foto de ejercicio';
    renderSidebar();
  }

  const imageFile = pendingFile;
  inputEl.value = ''; inputEl.style.height = 'auto';
  fileInput.value = ''; pendingFile = null; preview.style.display = 'none';

  sendBtn.disabled = true; stopBtn.style.display = 'inline-block';
  const botDiv = addMsg('bot', `<img class="thinking-logo" src="${LOGO_SRC}" alt="Pimath pensando"><span class="thinking-text">Pimath está pensando…</span>`, {thinking:true});

  ctl = new AbortController();
  try{
    let imageDataUrl = null;
    if(imageFile) imageDataUrl = await fileToDataURL(imageFile);

    const r = await fetch('/api/chat', {
      method: 'POST',
      signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        history: turns,
        message: text,
        image: imageDataUrl,
        studentName,
        area: currentArea
      })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      throw new Error(data.error || ('http_' + r.status));
    }
    const full = data.text || '';
    botDiv.classList.remove('thinking');
    botDiv.innerHTML = mdToHtml(full);
    renderMath(botDiv);
    chatEl.scrollTop = chatEl.scrollHeight;

    turns.push({role:'user', text: text || '(imagen enviada)'});
    turns.push({role:'model', text: full});
    addSpeakBtn(botDiv, full);
    history.push({role:'bot', html: mdToHtml(full), text: full, speak: true});
    saveState();
  }catch(e){
    botDiv.remove();
    if(e.name !== 'AbortError'){
      const note = document.createElement('div');
      note.className = 'error-note';
      note.textContent = errorCopy(e.message);
      chatEl.appendChild(note);
    }
  }finally{
    sendBtn.disabled = false;
    stopBtn.style.display = 'none';
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{ /* instalación no disponible; seguir sin PWA */ });
  });
}
</script>

function parseJwt(t){
  const b = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}
